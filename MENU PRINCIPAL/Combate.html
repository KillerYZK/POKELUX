<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1 class="titulo">POKELUX</h1>
        <p class="subtitulo">por YZK, Munny y Gael</p>
      </div>
      <div class="navbar">
        <button id="Equipo" class="boton-menu">Arma tu equipo</button>
        <button id="Combate" class="boton-menu">Menú de Combate</button>
        <button id="Inicio" class="boton-menu">Volver a Inicio</button>
      </div>
    </header>

    <div class="contenedor-principal">
      <h1 class="titulo-combate">Bienvenido al Menú de Combate!</h1>
      <div class="opciones-combate">
        <div class="opcion-combate">
          <button id="Comenzar" class="boton-combate">Crear Partida</button>
          <button id="Unirse" class="boton-combate">Unirse a Partida</button>
          <p class="descripcion-opcion">
            Enfrentate a otro jugador en un duelo pokemon!
          </p>
        </div>
        <div class="opcion-combate">
          <button id="consultar-combate" class="boton-combate">Consultar Equipo</button>
          <p class="descripcion-opcion">
            Consulta, modifica, elimina o selecciona tu equipo antes del combate.
          </p>
          <div id="equipos-guardados" class="equipos-guardados">
            <table>
              <thead>
                <tr>
                  <th>Nombre del Equipo</th>
                  <th>Pokemons</th>             <!-- Esto es un placeholder hasta hacer la tabla de vdd -->
                </tr>
              </thead>
              <tbody id="tabla-equipos">
              </tbody>
        </div>
        </div>
      </div>
    </div>
    <hr class="separador" />
    <script src="Script-MenuInicio.js"></script>
    <script src="Script-Combate.js"></script>
  </body>
</html>
