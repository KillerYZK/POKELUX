<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKELUX - Menu</title>
    <link rel="stylesheet" href="MenuJuego-Interfaz.css">
    <script src="MenuJuego.js"></script>
</head>
<body>
  <div class="pk-root">
    <div class="pk-content">
      <!-- NAVBAR -->
      <nav class="pk-navbar">
        <div class="pk-nav-logo">POKE<span>LUX</span></div>
        <!-- Botones de navegación -->
        <div class="pk-nav-buttons">
          <button class="pk-btn pk-btn-secondary">Inicio</button>
          <button class="pk-btn pk-btn-secondary">Pokemones</button>
          <button class="pk-btn pk-btn-secondary">Jugar</button>
          <button class="pk-btn pk-btn-secondary">Equipo</button>
          <button class="pk-btn pk-btn-secondary">Instrucciones</button>
        </div>
        <hr class="pk-nav-divider">
      </nav>

      <!-- HERO SECTION -->
      <div class="pk-hero">
        <h1 class="pk-title">Comenzar Combate</h1>
        <p class="pk-subtitle">Desafía tus habilidades como maestro Pokémon</p>
        <button class="pk-btn" id="btnCrearPartida">Crear Partida</button>
        <button class="pk-btn" id="btnUnirse">Unirse</button>
      </div>

      <!-- EQUIPO EQUIPADO SECTION -->
      <div class="pk-equipo-container">
        <h2 class="pk-equipo-title">Equipo Equipado</h2>
        <div class="pk-equipo-list">
          <div class="pk-equipo-item">
            <span class="pk-equipo-name">Equipo Activo</span>
            <div class="pk-pokemon-slots">
              <div class="pk-pokemon-slot"></div>
              <div class="pk-pokemon-slot"></div>
              <div class="pk-pokemon-slot"></div>
              <div class="pk-pokemon-slot"></div>
              <div class="pk-pokemon-slot"></div>
              <div class="pk-pokemon-slot"></div>
            </div>
            <span class="pk-equipo-options">S / B / E</span>
          </div>
        </div>
      </div>

      </div>
    </div>
  </div>
</body>
