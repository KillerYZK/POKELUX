<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuJuego-Interfaz</title>
    <link rel="stylesheet" href="MenuJuego-Interfaz.css">
</head>
<body>
    <div class="menu-Title">
        <h1 class="menu-title">POKELUX</h1>
    </div>
<!-- Opciones del menú -->
    <div class="menu-Options-Cards">
        <div class="menu-Option-Card">
            <h2 class="menu-option-title">Jugar</h2>
            <p class="menu-option-description">Inicia el juego y desafía tus habilidades como maestro Pokemon.</p>
            <button class="menu-option-button">Jugar</button>
        </div>

        <div class="menu-Option-Card">
             <h2 class="menu-option-title">Equipo</h2>
             <p class="menu-option-description">Configura tu equipo de Pokemon para el combate.</p>
             <button class="menu-option-button">Equipo</button>
            </div>

        <div class="menu-Option-Card">
            <h2 class="menu-option-title">Instrucciones</h2>
            <p class="menu-option-description">Aprende a jugar y descubre los secretos para convertirte en un verdadero maestro Pokemon.</p>
            <button class="menu-option-button">Instrucciones</button>
        </div>    
    </div>

    
</body>
