<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="Styles-(PROVICIONAL)/Styles-MenuInicio.css" />
  </head>

  <body>
    <main class="contenedor-principal">
      <header>
        <div class="logo">
          <h1 class="titulo">POKELUX</h1>
          <p class="subtitulo">por YZK, Munny y Gael</p>
        </div>
        <hr class="separador" />
      </header>

      <div class="contenido">
        <div class="opciones-menu">
          <div class="opcion-menu">
            <button id="Combate" class="boton-menu">Menú de Combate</button>
            <p class="descripcion-opcion">Prepárate para el combate!</p>
          </div>
          <div class="opcion-menu">
            <button id="Equipo" class="boton-menu">Tu equipo Pokemon</button>
            <p class="descripcion-opcion">
              Gestiona y personaliza tu equipo de Pokemons.
            </p>
          </div>
          <div class="opcion-menu">
            <button id="Pokedex" class="boton-menu">Pokedex</button>
            <p class="descripcion-opcion">
              Explora la Pokedex y descubre nuevos Pokemons.
            </p>
          </div>  <!-- ← este div también faltaba cerrarse -->
        </div>
      </div>
    </main>
    <script src="Script-MenuInicio.js"></script>
  </body>
</html>
