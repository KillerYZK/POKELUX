<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="Styles-(PROVICIONAL)/Styles-Personalizar.css"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1 class="titulo">POKELUX</h1>
        <p class="subtitulo">por YZK, Munny y Gael</p>
      </div>
      <div class="navbar">
        <button id="Equipo" class="boton-menu">Volver</button>
      </div>
      <hr class="separador" />
    </header>

    <main class="contenedor-principal">
      <div id="tarjetas-personalizar">
        <h1 id="nombre-pokemon"></h1>
        <img id="imagen-pokemon" src="" />
        <input type="text" id="apodo" placeholder="Elegir apodo" />
        <input
          type="number"
          id="nivel"
          placeholder="Elegir nivel"
          min="1"
          max="100"
        />
        <select id="genero">
          <option value="">Género</option>
          <option value="macho">Macho</option>
          <option value="hembra">Hembra</option>
        </select>
        <label> <input type="checkbox" id="shiny" /> Shiny </label>
      </div>

      <div id="movimientos-personalizar">
        <select id="movimiento-1">
          <option>Movimiento 1</option>
        </select>
        <select id="movimiento-2">
          <option>Movimiento 2</option>
        </select>
        <select id="movimiento-3">
          <option>Movimiento 3</option>
        </select>
        <select id="movimiento-4">
          <option>Movimiento 4</option>
        </select>
      </div>

      <div id="stats"></div>

      <div id="objeto-personalizar">
      <h3>Objeto asignado</h3>
      <div id="objeto-opciones"></div>
      </div>
      <button id="guardar">Guardar</button>

          <div id="stats"></div>

      <div id="objeto-personalizar">
        <h3>Objeto asignado</h3>
        <div id="objeto-opciones"></div>
      </div>

      <button id="guardar">Guardar</button>
    
    </main>

    <script src="Script-Personalizar.js"></script>
  </body>
</html>
